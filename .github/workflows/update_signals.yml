name: Update Trading Signals

on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"   # every 15 min during ~US market hours (13:00-20:59 UTC), Mon-Fri
    - cron: "30 21 * * 1-5"        # 21:30 UTC = final snapshot after US market close, Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_pipeline.py

      - name: Commit updated signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update trading signals [skip ci]"
          git push
