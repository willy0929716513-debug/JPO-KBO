name: Update Trading Signals

# Runs every 5 minutes, around the clock -- GitHub Actions' shortest
# supported schedule interval. This used to be a narrow "US market hours"
# window, which completely missed e.g. Taiwan's trading session. Now the
# pipeline itself (src/data/market_hours.py) checks per-symbol whether that
# symbol's market is actually open and skips/carries-forward the ones that
# aren't, so running this frequently and continuously is cheap: closed
# markets are never re-analyzed, only re-tagged.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false  # queue overlapping runs rather than cancel one mid-write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # watchlist grew to ~60 symbols (48 Taiwan large-caps + others); more headroom than the original 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_pipeline.py

      - name: Commit updated signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update trading signals [skip ci]"
          git pull --rebase origin main
          git push
